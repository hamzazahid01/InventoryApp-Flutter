org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Reduces Kotlin incremental cache corruption on some Windows setups ("Storage ... already registered").
# Remove this line if Android builds are slow and you do not see Kotlin daemon errors.
kotlin.incremental=false
